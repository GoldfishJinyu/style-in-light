<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从性格和审美偏好出发，发现自己喜欢的风格。">
  <meta name="theme-color" content="#f9f7f1">
  <title>美学坐标 · 个人风格探索</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="wrap topbar">
      <a href="#home" class="brand"><span aria-hidden="true">✳</span> 美学坐标</a>
      <nav aria-label="主导航">
        <a class="nav-library" href="#styles">风格图鉴</a>
        <a id="nav-quiz" class="button outline small" href="#quiz">开始测试</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <section id="home-view">
      <div class="wrap hero">
        <div class="hero-copy">
          <p class="eyebrow">个人风格探索</p>
          <h1>找到你的<br><em>美学坐标<span>。</span></em></h1>
          <p class="lede">从性格、日常习惯和直觉偏好出发，找到与你相契合的风格，再把它带进衣柜、房间和周末。</p>
          <div class="hero-actions"><a class="button" href="#quiz">开始风格测试</a><a class="text-link" href="#styles">先看看风格</a></div>
          <p class="micro">8 道题 · 约 3 分钟</p>
        </div>
        <figure class="hero-figure">
          <div class="hero-image" role="img" aria-label="橙色花朵、钴蓝花器和红色座椅组成的室内静物"></div>
          <figcaption><span>色彩、形状与日常物件</span><span lang="en">STYLE COORDINATES</span></figcaption>
        </figure>
      </div>
      <section class="library" id="styles" aria-labelledby="library-title">
        <div class="wrap">
          <div class="section-head"><h2 id="library-title">风格图鉴</h2><p>从一眼喜欢的画面，开始认识不同的审美。</p></div>
          <div class="style-grid" id="style-grid"></div>
        </div>
      </section>
    </section>
    <section id="quiz-view" class="wrap inner" hidden aria-label="风格测试">
      <div class="sheet" id="quiz-content"></div>
    </section>
    <section id="report-view" class="wrap inner" hidden aria-label="风格报告">
      <div id="report-content"></div>
    </section>
    <section id="detail-view" class="wrap inner" hidden aria-label="风格详情">
      <div id="detail-content"></div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><a class="brand" href="#home"><span aria-hidden="true">✳</span> 美学坐标</a><span>答题与报告在当前页面生成。</span></div></footer>
</body>
</html>
