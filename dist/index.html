<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="探索穿搭、物件、艺术与音乐，找到自己的美学坐标。">
  <meta name="theme-color" content="#f4f0e8">
  <title>美学坐标 · 个人风格探索</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <script src="catalog.js" defer></script>
  <script src="questions.js" defer></script>
  <script src="traditional.js" defer></script>
  <script src="images.js" defer></script>
  <script src="app.js?v=paths" defer></script>
</head>
<body>
  <a class="skip" id="skip" href="#main"></a>
  <header class="site-header"><div class="wrap topbar">
    <a href="#home" id="brand" class="brand"></a>
    <nav aria-label="主导航">
      <a id="nav-library" href="#styles"></a>
      <a id="nav-quiz" class="button outline small" href="#quiz"></a>
    </nav>
    <div class="settings">
      <label for="locale" id="locale-label" class="sr-only"></label>
      <select id="locale" class="locale">
        <option value="zh-Hans" lang="zh-Hans">简体中文</option>
        <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
        <option value="en" lang="en">English</option>
      </select>
      <button class="theme-toggle" id="theme" type="button"></button>
    </div>
  </div></header>
  <main id="main" tabindex="-1">
    <div id="home-view">
      <section class="wrap hero" id="hero"></section>
      <section class="library" id="styles" aria-labelledby="library-title">
        <div class="wrap">
          <div class="section-head" id="library-head"></div>
          <form class="filters" id="filters"></form>
          <p class="count" id="count" aria-live="polite"></p>
          <div class="style-grid" id="style-grid"></div>
        </div>
      </section>
    </div>
    <section id="quiz-view" class="wrap inner" hidden><div class="sheet" id="quiz-content"></div></section>
    <section id="report-view" class="wrap inner" hidden><div id="report-content"></div></section>
    <section id="detail-view" class="wrap inner" hidden><div id="detail-content"></div></section>
    <section id="credits-view" class="wrap inner" hidden><div id="credits-content"></div></section>
  </main>
  <footer><div class="wrap footer-inner" id="footer"></div></footer>
</body>
</html>
